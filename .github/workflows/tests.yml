name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest pytest-cov
      - name: Unit, integration and system tests with branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=70
      - name: Seeded bot-only tournaments (invariants checked after every action)
        run: python simulate.py --seed 1 --tournaments 20
